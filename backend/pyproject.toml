[project]
name = "ihaesge-backend"
version = "0.1.0"
description = "Initial backend skeleton for IHAESGE SaaS platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.2",
  "redis>=5.0.8",
  "pydantic-settings>=2.5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

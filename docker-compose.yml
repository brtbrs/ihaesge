services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ihaesge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ihaesge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ihsg}
      POSTGRES_DB: ${POSTGRES_DB:-ihaesgedibi}
    ports:
      - "5432:5432"
    volumes:
      - "./postgres_data:/var/lib/postgresql/data:rw"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ihaesge} -d ${POSTGRES_DB:-ihaesgedibi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ihaesge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: ihaesge-backend
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
